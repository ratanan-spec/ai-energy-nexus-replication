name: Static checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R sources
        run: |
          Rscript -e 'files <- c(list.files("R", pattern="\\.R$", full.names=TRUE), "config.R", "00_run_all.R", "preflight.R", "install_packages.R"); invisible(lapply(files, parse)); cat("R parsing passed\\n")'
      - name: Compile Python helper
        run: python -m py_compile tools/normalize_vendor_dates.py
